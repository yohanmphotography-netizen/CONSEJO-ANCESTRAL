<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morenas Ritual - Oráculo & Consejo Ancestral</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Cormorant+Garamond:ital,wght@0,600;1,400;1,600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #8c6d23;
            --bg-wood: #140b07;
            --parchment-top: #f3e5ca;
            --parchment-bottom: #cbb288;
            --text-dark: #21130b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-wood);
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(60, 32, 16, 0.6) 0%, rgba(10, 5, 3, 0.95) 100%),
                repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 2px, transparent 2px, transparent 4px);
            color: #f3e5ab;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Partículas flotantes */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: var(--gold-light);
            border-radius: 50%;
            opacity: 0.3;
            pointer-events: none;
            animation: float 8s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
        }

        /* Hojas de Monstera */
        .monstera {
            position: fixed;
            width: 130px;
            height: 130px;
            opacity: 0.3;
            pointer-events: none;
            z-index: 1;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
        }
        .monstera-tl { top: -20px; left: -20px; transform: rotate(15deg); }
        .monstera-br { bottom: -20px; right: -20px; transform: rotate(195deg); }

        .container {
            width: 100%;
            max-width: 440px;
            perspective: 1200px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4), 0 2px 4px rgba(0,0,0,0.9);
        }

        .header p {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.15rem;
            color: var(--gold-light);
        }

        /* Carta Flip */
        .card-wrapper {
            width: 100%;
            height: 590px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .card-wrapper.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 15px rgba(212, 175, 55, 0.2);
            border: 2px solid var(--gold);
            overflow: hidden;
            padding: 14px;
        }

        /* REVERSO */
        .card-back {
            background: linear-gradient(145deg, #2c1a10 0%, #0f0703 100%);
            border: 3px double var(--gold);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card-back-frame {
            border: 1px solid rgba(212, 175, 55, 0.35);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(rgba(212, 175, 55, 0.15) 1px, transparent 1px);
            background-size: 18px 18px;
        }

        .seal-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .tap-prompt {
            color: var(--gold-light);
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 3px;
            margin-top: 20px;
            animation: pulse 2s infinite;
        }

        /* ANVERSO */
        .card-front {
            background: radial-gradient(ellipse at center, var(--parchment-top) 0%, var(--parchment-bottom) 100%);
            transform: rotateY(180deg);
            border: 4px double #4a3415;
            color: var(--text-dark);
        }

        .card-inner {
            border: 1px solid var(--gold-dark);
            height: 100%;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            background-image: linear-gradient(to bottom, rgba(255,255,255,0.2), rgba(0,0,0,0.05));
        }

        .card-num {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            color: #6e4e19;
            letter-spacing: 3px;
            font-weight: 700;
        }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: #1a0b04;
            letter-spacing: 2px;
            padding-bottom: 4px;
            border-bottom: 1.5px solid var(--gold-dark);
            width: 90%;
            font-weight: 800;
        }

        .card-icon {
            width: 55px;
            height: 55px;
            margin: 4px 0;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
        }

        .box-section {
            width: 100%;
            background: rgba(30, 18, 9, 0.05);
            border: 1px solid rgba(110, 78, 25, 0.25);
            border-radius: 6px;
            padding: 8px 10px;
            margin: 3px 0;
        }

        .section-label {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            color: #6e4e19;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .text-advice {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            line-height: 1.25;
            color: #1a0b04;
            font-weight: 600;
        }

        .text-pairing {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.02rem;
            line-height: 1.25;
            color: #2b170a;
            font-weight: 600;
        }

        /* Selector de Signo */
        .zodiac-container {
            width: 100%;
            margin-top: 14px;
            display: flex;
            justify-content: center;
        }

        .zodiac-select {
            width: 100%;
            background: #1e110a;
            color: var(--gold-light);
            border: 1px solid var(--gold);
            padding: 10px 15px;
            border-radius: 20px;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-align: center;
            text-align-last: center;
            outline: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .zodiac-select option {
            background: #140b07;
            color: var(--gold-light);
        }

        /* Botón Consultar */
        .btn-draw {
            margin-top: 10px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: #120803;
            border: 1px solid var(--gold-light);
            padding: 12px 24px;
            border-radius: 25px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-draw:active {
            transform: scale(0.96);
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="particle" style="top: 20%; left: 15%; animation-delay: 0s;"></div>
    <div class="particle" style="top: 70%; left: 80%; animation-delay: 2s;"></div>

    <svg class="monstera monstera-tl" viewBox="0 0 24 24" fill="#1b3828">
        <path d="M12,2C6.48,2,2,6.48,2,12c0,5.52,4.48,10,10,10s10-4.48,10-10C22,6.48,17.52,2,12,2z M11,19.93C7.06,19.43,4,16.07,4,12c0-0.74,0.11-1.46,0.3-2.14l4.24,7.34L11,19.93z M18,16.5l-3.5-6h6.2C20.2,12.5,19.3,14.7,18,16.5z"/>
    </svg>
    <svg class="monstera monstera-br" viewBox="0 0 24 24" fill="#1b3828">
        <path d="M12,2C6.48,2,2,6.48,2,12c0,5.52,4.48,10,10,10s10-4.48,10-10C22,6.48,17.52,2,12,2z M11,19.93C7.06,19.43,4,16.07,4,12c0-0.74,0.11-1.46,0.3-2.14l4.24,7.34L11,19.93z M18,16.5l-3.5-6h6.2C20.2,12.5,19.3,14.7,18,16.5z"/>
    </svg>

    <div class="container">
        <header class="header">
            <h1>Morenas Ritual</h1>
            <p>Oráculo & Consejo Ancestral</p>
        </header>

        <div class="card-wrapper" id="cardWrapper" onclick="flipCard()">
            <!-- REVERSO -->
            <div class="card-face card-back">
                <div class="card-back-frame">
                    <div class="seal-circle">
                        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="1.5">
                            <circle cx="12" cy="12" r="9"/>
                            <path d="M12 3a9 9 0 0 0 0 18M12 7a5 5 0 0 1 0 10"/>
                        </svg>
                    </div>
                    <p style="font-family: 'Cinzel', serif; color: var(--gold); letter-spacing: 4px; font-size: 1.1rem; font-weight: 700;">CONSEJO</p>
                    <p style="font-family: 'Cormorant Garamond', serif; color: var(--gold-light); font-style: italic; font-size: 1.05rem;">Ancestral</p>
                    <p class="tap-prompt">✨ TOCA PARA DESCUBRIR ✨</p>
                </div>
            </div>

            <!-- ANVERSO -->
            <div class="card-face card-front">
                <div class="card-inner">
                    <div>
                        <div class="card-num" id="cardNum">ARCANO 0</div>
                        <h2 class="card-title" id="cardTitle">EL LOCO</h2>
                    </div>

                    <svg class="card-icon" viewBox="0 0 24 24" fill="#8c6d23">
                        <path d="M12 2L15 8L22 9L17 14L18.5 21L12 17.5L5.5 21L7 14L2 9L9 8L12 2Z"/>
                    </svg>

                    <div class="box-section">
                        <div class="section-label">✦ Consejo del Universo ✦</div>
                        <p class="text-advice" id="universeAdvice">Cargando...</p>
                    </div>

                    <div class="box-section" style="background: rgba(212, 175, 55, 0.08); border-color: rgba(140, 109, 35, 0.4);">
                        <div class="section-label">🍷 Sugerencia del Ritual 🍷</div>
                        <p class="text-pairing" id="ritualPairing">Cargando...</p>
                    </div>

                    <p style="font-size: 0.6rem; color: #5a4019; font-family: 'Montserrat', sans-serif; letter-spacing: 1px;">MORENAS RITUAL • TAROT RITUAL</p>
                </div>
            </div>
        </div>

        <!-- SELECTOR DE SIGNO ZODIACAL -->
        <div class="zodiac-container">
            <select class="zodiac-select" id="zodiacSelect" onchange="updateZodiacAdvice()">
                <option value="Aries">♈ Aries</option>
                <option value="Tauro">♉ Tauro</option>
                <option value="Géminis">♊ Géminis</option>
                <option value="Cáncer">♋ Cáncer</option>
                <option value="Leo">♌ Leo</option>
                <option value="Virgo" selected>♍ Virgo</option>
                <option value="Libra">♎ Libra</option>
                <option value="Escorpio">♏ Escorpio</option>
                <option value="Sagitario">♐ Sagitario</option>
                <option value="Capricornio">♑ Capricornio</option>
                <option value="Acuario">♒ Acuario</option>
                <option value="Piscis">♓ Piscis</option>
            </select>
        </div>

        <button class="btn-draw" onclick="drawNewCard(event)">🔮 CONSULTAR OTRA CARTA</button>
    </div>

    <script>
        const arcanos = [
            {
                num: "ARCANO 0",
                name: "EL LOCO",

            },
            {
                num: "ARCANO I",
                name: "EL MAGO",
                consejo: "Tienes el talento y los recursos para manifestar lo que deseas. Enfoca tu energía y da el primer paso.",

            },
            {

                platillo: "Crema de Espinaca y Queso",
                bebida: "Vino",
                razon: "Sabores suaves y sutiles que invitan a la calma y la reflexión."
            },
            {
                num: "ARCANO III",
                name: "LA EMPERATRIZ",
                consejo: "Disfruta de tus sentidos y abre los brazos a la abundancia y al placer en todas sus formas.",
                platillo: "Salmón Confitado",
                bebida: "Vino",
                razon: "Una experiencia envolvente que rinde homenaje a la abundancia y la belleza."
            },
            {
                num: "ARCANO IV",
                name: "EL EMPERADOR",
                consejo: "Mantén la firmeza y pon límites claros. La verdadera fuerza nace de la disciplina y el enfoque.",
                platillo: "Solomillo de Ternera",
                bebida: "Vino",
                razon: "Un plato robusto y lleno de carácter que reafirma tu liderazgo."
            },
            {
                num: "ARCANO V",
                name: "EL SUMO SACERDOTE",
                consejo: "Honra las tradiciones y aprende de la experiencia. En la sabiduría compartida hallarás tu guía.",
                platillo: "Torrezno Crujiente",
                bebida: "Cerveza",
                razon: "Sabores auténticos y tradicionales que conectan con tus raíces."
            },
            {
                num: "ARCANO VI",
                name: "LOS ENAMORADOS",
                consejo: "Elige desde el corazón y con honestidad. Las mejores uniones crecen sobre la verdad mutua.",
                platillo: "Arroz Cremoso para Compartir",
                bebida: "Cóctel tradicional",
                razon: "El maridaje ideal para celebrar la armonía, la complacencia y la unión."
            },
            {
                num: "ARCANO VII",
                name: "EL CARRO",
                consejo: "Avanza con determinación. Tu enfoque y voluntad superarán cualquier obstáculo en tu camino.",
                platillo: "Entrecot a la Brasa",
                bebida: "Cerveza",
                razon: "Fuerza e intensidad de sabor para mantener el impulso triunfador."
            },
            {
                num: "ARCANO VIII",
                name: "LA FUERZA",
                consejo: "La auténtica firmeza es serena y paciente. Conquista tus dudas desde el autocontrol y la gentileza.",
                platillo: "Carrilleras de Cerdo Ibérico",
                bebida: "Vino",
                razon: "Cocción lenta y suave donde la paciencia transforma la materia con maestría."
            },
            {
                num: "ARCANO IX",
                name: "EL ERMITAÑO",
                consejo: "Regálate un momento de silencio. La luz para iluminar tus decisiones siempre ha estado dentro de ti.",
                platillo: "Flan de Café Artesanal",
                bebida: "Cóctel Morenas",
                razon: "El matiz cálido e intenso del café para acompañar una pausa reparadora."
            },
            {
                num: "ARCANO X",
                name: "LA RUEDA DE LA FORTUNA",
                consejo: "El cambio es constante. Fluye con los ciclos de la vida; lo que hoy se mueve abrirá nuevas oportunidades.",
                platillo: "Totopos Especiales",
                bebida: "Cerveza",
                razon: "Un toque dinámico y festivo para celebrar el movimiento constante de la fortuna."
            },
            {
                num: "ARCANO XI",
                name: "LA JUSTICIA",
                consejo: "Busca la verdad y la transparencia en cada acto. La claridad llegará cuando seas honesto contigo.",
                platillo: "Patatas con Alioli Casero",
                bebida: "Vino",
                razon: "Proporción justa y armoniosa entre la textura crujiente y la frescura."
            },
            {
                num: "ARCANO XII",
                name: "EL COLGADO",
                consejo: "Cambia la perspectiva y suelta el control. A veces, la pausa es la estrategia más sabia.",
                platillo: "Coulant de Chocolate",
                bebida: "Cóctel tradicional",
                razon: "Un momento dulce que invita a detener el tiempo y saborear sin prisas."
            },
            {
                num: "ARCANO XIII",
                name: "LA MUERTE",
                consejo: "Cierra ciclos sin temor. Todo final despeja el terreno para un renacimiento renovado.",
                platillo: "Tapa Intensa de la Casa",
                bebida: "Cóctel Morenas",
                razon: "Sabores marcados y contrastantes que celebran las nuevas transformaciones."
            },
            {
                num: "ARCANO XIV",
                name: "LA TEMPLANZA",
                consejo: "Maneja todo con moderación y paciencia. Tu paz interior se cultiva paso a paso.",
                platillo: "Ensalada de la Huerta",
                bebida: "Vino",
                razon: "Frescura equilibrada e ingredientes armónicos para reconectar el cuerpo."
            },
            {
                num: "ARCANO XV",
                name: "EL DIABLO",
                consejo: "Reconoce tus pasiones sin juzgarte. Liberarte empieza por aceptar tus deseos.",
                platillo: "Tequeños de Queso Fundente",
                bebida: "Cóctel Morenas",
                razon: "Una tentación cremosa e irresistible a la que da gusto ceder."
            },
            {
                num: "ARCANO XVI",
                name: "LA TORRE",
                consejo: "Lo que se derrumba despeja tu horizonte. Construye de nuevo sobre cimientos verdaderos.",
                platillo: "Patatas Picantes",
                bebida: "Cerveza",
                razon: "Una chispaza picante y directa que remueve tus sentidos al instante."
            },
            {
                num: "ARCANO XVII",
                name: "LA ESTRELLA",
                consejo: "Mantiene la fe y la inspiración. Tu horizonte se aclara con serenidad y buena esperanza.",
                platillo: "Cremoso de Frutos Rojos",
                bebida: "Cóctel tradicional",
                razon: "Un toque fresco, ligero y dulce que llena de luz el paladar."
            },
            {
                num: "ARCANO XVIII",
                name: "LA LUNA",
                consejo: "Camina con precaución y confía en tu intuición. Tu instinto te guiará en la penumbra.",
                platillo: "Tapa Mística Morenas",
                bebida: "Cóctel Morenas",
                razon: "Notas enigmáticas y envolventes preparadas para las noches de misterio."
            },
            {
                num: "ARCANO XIX",
                name: "EL SOL",
                consejo: "Muestra tu luz sin reservas. Tu alegría y vitalidad ilumina tu entorno.",
                platillo: "Magret de Pato con Frutos Cítricos",
                bebida: "Vino",
                razon: "Sabores cálidos y luminosos que celebran la energía radiante del triunfo."
            },
            {
                num: "ARCANO XX",
                name: "EL JUICIO",
                consejo: "Es momento de renovarte. Deja atrás el pasado y responde a tu llamado con confianza.",
                platillo: "Chipirones a la Plancha",
                bebida: "Cerveza",
                razon: "Sabores directos y del mar que despiertan la frescura del momento."
            },
            {
                num: "ARCANO XXI",
                name: "EL MUNDO",
                consejo: "Has completado una importante lección. Celebra el éxito y la plenitud alcanzada.",
                platillo: "Arroz Cremoso de Mariscos",
                bebida: "Cóctel Morenas",
                razon: "La culminación perfecta para un recorrido inolvidable."
            }
        ];

        let currentArcano = null;

        window.onload = function() {
            getRandomArcano();
        };

        function getRandomArcano() {
            const index = Math.floor(Math.random() * arcanos.length);
            currentArcano = arcanos[index];
            updateDisplay();
        }

        function updateDisplay() {
            if (!currentArcano) return;
            const sign = document.getElementById('zodiacSelect').value;

            document.getElementById('cardNum').innerText = currentArcano.num;
            document.getElementById('cardTitle').innerText = currentArcano.name;
            
            // Consejo adaptado al signo
            document.getElementById('universeAdvice').innerText = `Para ${sign}: ${currentArcano.consejo}`;
            
            // Sugerencia con plato + bebida de la lista autorizada
            document.getElementById('ritualPairing').innerText = `${currentArcano.platillo} acompañado de ${currentArcano.bebida}. ${currentArcano.razon}`;
        }

        function updateZodiacAdvice() {
            updateDisplay();
        }

        function flipCard() {
            document.getElementById('cardWrapper').classList.toggle('flipped');
        }

        function drawNewCard(event) {
            event.stopPropagation();
            const wrapper = document.getElementById('cardWrapper');

            wrapper.classList.remove('flipped');

            setTimeout(() => {
                getRandomArcano();
                wrapper.classList.add('flipped');
            }, 350);
        }
    </script>
</body>
</html>
